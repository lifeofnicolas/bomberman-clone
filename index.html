<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bomberman Clone</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-group" id="hud-p1">
        <span class="hud-label p1">P1</span>
        <span class="hud-stat" title="Lives">&#10084; <b id="hud-lives">3</b></span>
        <span class="hud-stat" title="Bombs">&#128163; <b id="hud-bombs">1</b></span>
        <span class="hud-stat" title="Flame range">&#128293; <b id="hud-range">1</b></span>
        <span class="hud-stat" title="Speed">&#9889; <b id="hud-speed">1</b></span>
      </div>
      <div class="hud-group center">
        <span class="hud-stat" title="Level"><span id="hud-level-label">LEVEL</span> <b id="hud-level">1</b></span>
        <span class="hud-stat timer" title="Time left">&#9201; <b id="hud-time">200</b></span>
        <span class="hud-stat" title="Score">SCORE <b id="hud-score">0</b></span>
        <span class="hud-stat" id="hud-mute" title="Sound on (M)">&#128266;</span>
      </div>
      <div class="hud-group" id="hud-p2">
        <span class="hud-label p2">P2</span>
        <span class="hud-stat" title="Lives">&#10084; <b id="hud-lives2">3</b></span>
        <span class="hud-stat" title="Bombs">&#128163; <b id="hud-bombs2">1</b></span>
        <span class="hud-stat" title="Flame range">&#128293; <b id="hud-range2">1</b></span>
        <span class="hud-stat" title="Speed">&#9889; <b id="hud-speed2">1</b></span>
      </div>
    </header>

    <main id="stage">
      <canvas id="game" width="720" height="624"></canvas>

      <div id="overlay" class="visible">
        <h1 id="overlay-title">BOMBERMAN</h1>
        <p id="overlay-text"></p>
        <div id="overlay-buttons"></div>
        <div id="overlay-help"></div>
      </div>
    </main>

    <footer id="controls">
      <div class="control-block">
        <b>Player 1</b> &mdash; Move: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or Arrows &nbsp; Bomb: <kbd>Space</kbd>
      </div>
      <div class="control-block">
        <b>Player 2</b> &mdash; Move: <kbd>I</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd> &nbsp; Bomb: <kbd>Enter</kbd>
      </div>
      <div class="control-block">
        <kbd>P</kbd> Pause &nbsp; <kbd>M</kbd> Mute &nbsp; <kbd>R</kbd> Restart
      </div>
    </footer>
  </div>

  <script src="js/constants.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/level.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
